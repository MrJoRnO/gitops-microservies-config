# Helm values for aws-load-balancer-controller
# chart: eks/aws-load-balancer-controller
#
# Values that differ per environment are marked with *** REPLACE ***.
# These come from Terraform outputs:
#
#   terraform output -raw cluster_name           → clusterName
#   terraform output -raw alb_controller_role_arn → serviceAccount.annotations
#   terraform output -raw vpc_id                 → vpcId
#
# In a full GitOps setup, a CI step patches these values after terraform apply.

# -----------------------------------------------------------------------
# Cluster identity — REQUIRED
# -----------------------------------------------------------------------
clusterName: platform-dev      # *** REPLACE: platform-<env> ***

# -----------------------------------------------------------------------
# Service Account with IRSA
# -----------------------------------------------------------------------
serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/dev-eks-alb-controller-role
    # *** REPLACE: use `terraform output -raw alb_controller_role_arn` ***

# -----------------------------------------------------------------------
# AWS region and VPC — required for subnet auto-discovery
# -----------------------------------------------------------------------
region: eu-central-1
vpcId: vpc-00000000000000000   # *** REPLACE: terraform output -raw vpc_id ***

# -----------------------------------------------------------------------
# HA — 2 replicas so a single pod disruption doesn't break ALB sync
# -----------------------------------------------------------------------
replicaCount: 2

podDisruptionBudget:
  maxUnavailable: 1

# -----------------------------------------------------------------------
# Resource sizing — appropriate for a small production cluster
# -----------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -----------------------------------------------------------------------
# Tolerations — run on system nodes (no application taint)
# -----------------------------------------------------------------------
tolerations: []

nodeSelector:
  role: system

# -----------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------
logLevel: info

# -----------------------------------------------------------------------
# Enable Shield and WAF integrations if available in your account
# -----------------------------------------------------------------------
enableShield: false
enableWaf: false
enableWafv2: false
