apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-api-gateway
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:123456789012:certificate/PROD-CERT-ARN
    alb.ingress.kubernetes.io/group.name: platform-prod
    # WAF ACL (optional — uncomment when WAF is configured)
    # alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:...
spec:
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saas-api-gateway
                port:
                  name: http
