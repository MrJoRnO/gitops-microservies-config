apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

patches:
  - path: ingress-patch.yaml

# CD pipeline updates newTag on every successful build of the main branch.
# Format: main-<short-git-sha>  e.g. main-a1b2c3d4
images:
  - name: platform/saas-api-gateway
    newName: REGISTRY_PLACEHOLDER/platform/saas-api-gateway
    newTag: main-latest
