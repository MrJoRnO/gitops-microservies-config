apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

patches:
  - path: ingress-patch.yaml

# CD pipeline updates newTag on every successful build of the staging/dev branch.
# Format: <branch>-<short-git-sha>  e.g. staging-a1b2c3d4
images:
  - name: platform/saas-api-gateway
    newName: REGISTRY_PLACEHOLDER/platform/saas-api-gateway
    newTag: staging-latest
