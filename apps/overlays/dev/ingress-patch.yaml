apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-api-gateway
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:123456789012:certificate/DEV-CERT-ARN
    alb.ingress.kubernetes.io/group.name: platform-dev
spec:
  rules:
    - host: app.dev.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saas-api-gateway
                port:
                  name: http
