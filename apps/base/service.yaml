apiVersion: v1
kind: Service
metadata:
  name: saas-api-gateway
  labels:
    app: saas-api-gateway
spec:
  # ClusterIP — traffic enters via ALB Ingress → Istio Gateway → this Service.
  # The ALB controller targets pods directly (targetType: ip) so no NodePort needed.
  type: ClusterIP
  selector:
    app: saas-api-gateway
    version: stable
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
