---
# Pulls the Anthropic API key from AWS Secrets Manager via the External Secrets
# Operator (ESO).  The ClusterSecretStore "aws-secrets-manager" is assumed to
# already exist and be backed by the ESO IRSA role defined in the iam module.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: anthropic-api-key
  namespace: ai-troubleshooter
  labels:
    app: ai-troubleshooter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: anthropic-api-key       # the K8s Secret that ESO will create
    creationPolicy: Owner
  data:
    - secretKey: api-key          # key inside the K8s Secret
      remoteRef:
        key: ai-troubleshooter/anthropic-api-key   # path in Secrets Manager
        property: api_key                          # JSON field inside the secret
