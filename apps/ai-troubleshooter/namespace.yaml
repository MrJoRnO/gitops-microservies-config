apiVersion: v1
kind: Namespace
metadata:
  name: ai-troubleshooter
  labels:
    # Istio sidecar injection — keeps the troubleshooter inside the mesh
    istio-injection: enabled
    # Pod Security Admission — baseline is enough; the pod is already non-root
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
