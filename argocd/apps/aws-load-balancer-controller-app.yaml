apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform-apps
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-apps

  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: "1.8.3"   # pin to a specific chart version

    helm:
      # Values file lives in the config-repo alongside this Application.
      # ArgoCD supports only one source in OSS; for multi-source use ArgoCD v2.6+
      # or embed the values inline below.
      values: |
        clusterName: platform-dev           # REPLACE per env
        region: eu-central-1
        vpcId: vpc-00000000000000000        # REPLACE: terraform output -raw vpc_id
        replicaCount: 2
        podDisruptionBudget:
          maxUnavailable: 1
        serviceAccount:
          create: true
          name: aws-load-balancer-controller
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/dev-eks-alb-controller-role
            # REPLACE: terraform output -raw alb_controller_role_arn
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        nodeSelector:
          role: system
        logLevel: info
        enableShield: false
        enableWaf: false
        enableWafv2: false

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # kube-system already exists
      - ServerSideApply=true
